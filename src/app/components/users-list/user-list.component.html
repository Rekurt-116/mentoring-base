<div class="container">
    <div *ngFor="let user of users" class="item-cards__grid-left" style="display: flex;">
        <h3> {{user.name}} </h3>
        <p> {{user.email}} </p>
        <p> {{user.phone}} </p>
        <button (click)="deleteUser(user.id)"> Удалить пользователя </button>

    </div>
</div>
